<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Girl · AI 对话与小窝</title>
  <style>
    :root {
      --bg: #fff6f8;
      --card: rgba(255,255,255,.9);
      --text: #33252b;
      --muted: #8d6b76;
      --primary: #ff6f9f;
      --primary-dark: #e94f84;
      --soft: #ffe1eb;
      --line: rgba(255,111,159,.22);
      --shadow: 0 18px 50px rgba(233,79,132,.16);
      --radius: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, #ffe2ed 0, transparent 30%),
        radial-gradient(circle at 92% 12%, #ffe8c7 0, transparent 26%),
        linear-gradient(180deg, var(--bg), #fffafc);
    }
    .app { width: min(100%, 480px); margin: 0 auto; min-height: 100vh; padding: 18px 16px 96px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .brand { display:flex; gap:12px; align-items:center; }
    .avatar { width:52px; height:52px; border-radius:18px; display:grid; place-items:center; background:linear-gradient(135deg,#ff8eb5,#ffd1de); box-shadow:var(--shadow); font-size:26px; }
    .brand h1 { margin:0; font-size:20px; letter-spacing:-.4px; }
    .brand p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .chip { border:1px solid var(--line); background:var(--card); color:var(--primary-dark); padding:8px 12px; border-radius:999px; font-weight:800; font-size:12px; box-shadow:0 10px 25px rgba(255,111,159,.1); }
    .page { display:none; animation:fade .25s ease; }
    .page.active { display:block; }
    @keyframes fade { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
    .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; backdrop-filter:blur(14px); margin-bottom:14px; }
    .card h2,.card h3 { margin:0 0 10px; }
    .card h2 { font-size:18px; }
    .card h3 { font-size:16px; }
    .hint { color:var(--muted); line-height:1.55; font-size:13px; margin:6px 0 0; }
    .warn { background:#fff1c7; border:1px solid #ffd56d; color:#704f00; border-radius:18px; padding:12px; font-size:13px; line-height:1.55; }
    .danger { background:#ffe4eb; border:1px solid #ffb4c9; color:#8e1742; border-radius:18px; padding:12px; font-size:13px; line-height:1.55; }
    .empty { color:var(--muted); text-align:center; padding:28px 10px; font-size:13px; }
    .small { color:var(--muted); font-size:12px; line-height:1.45; }
    .divider { height:1px; background:var(--line); margin:16px 0; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 6px; font-weight:800; }
    textarea,input,select { width:100%; border:1px solid var(--line); background:rgba(255,255,255,.94); border-radius:18px; padding:12px 13px; font-size:14px; outline:none; color:var(--text); transition:.2s; }
    textarea { resize:none; min-height:44px; max-height:160px; overflow:hidden; }
    textarea:focus,input:focus,select:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(255,111,159,.13); }
    .btn { border:0; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; border-radius:17px; padding:12px 16px; font-weight:900; cursor:pointer; box-shadow:0 12px 24px rgba(233,79,132,.22); min-height:44px; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .btn.secondary { background:white; color:var(--primary-dark); border:1px solid var(--line); box-shadow:none; }
    .btn.ghost { background:transparent; color:var(--primary-dark); box-shadow:none; border:1px solid var(--line); }
    .btn.danger-btn { background:linear-gradient(135deg,#ff5e7e,#c92a52); }
    .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .status { display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--line); border-radius:18px; padding:11px 12px; background:rgba(255,255,255,.72); }
    .dot { width:10px; height:10px; border-radius:50%; background:#bbb; display:inline-block; margin-right:6px; }
    .dot.on { background:#18aa60; }
    .dot.warn-dot { background:#e6a100; }
    .chat-box { height:54vh; min-height:380px; overflow:auto; padding:6px 2px 12px; scroll-behavior:smooth; }
    .bubble-row { display:flex; margin:9px 0; gap:8px; }
    .bubble-row.user,.bubble-row.me { justify-content:flex-end; }
    .bubble-row.assistant,.bubble-row.ta { justify-content:flex-start; }
    .bubble-row > div { max-width:78%; width:auto; display:flex; flex-direction:column; }
    .bubble-row.user > div,.bubble-row.me > div { align-items:flex-end; }
    .bubble-row.assistant > div,.bubble-row.ta > div { align-items:flex-start; }
    .bubble { display:block; width:auto; min-width:0; min-height:0; max-width:100%; padding:9px 13px; border-radius:18px; font-size:14px; line-height:1.55; text-align:left; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; box-shadow:0 8px 20px rgba(0,0,0,.04); }
    .bubble.user,.bubble.me { background:linear-gradient(135deg,var(--primary),#ff9dbc); color:white; border-bottom-right-radius:6px; }
    .bubble.assistant,.bubble.ta { background:white; color:var(--text); border:1px solid var(--line); border-bottom-left-radius:6px; }
    .meta { font-size:11px; color:var(--muted); margin-top:3px; }
    .msg-img { max-width:100%; border-radius:14px; margin-top:8px; border:1px solid var(--line); display:block; }
    .composer { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; }
    .ai-composer { grid-template-columns:1fr auto auto; }
    .attach-icon { width:48px; min-width:48px; padding:12px 0; font-size:18px; }
    .ai-upload-toolbar { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:center; margin:0 0 10px; }
    .upload-card { border:1px dashed var(--line); background:rgba(255,255,255,.84); color:var(--primary-dark); border-radius:18px; padding:12px 10px; text-align:center; font-weight:950; cursor:pointer; box-shadow:none; min-height:46px; display:flex; align-items:center; justify-content:center; }
    .upload-card:hover,.attach-icon:hover { border-color:var(--primary); box-shadow:0 0 0 4px rgba(255,111,159,.10); }
    .file-preview { display:none; max-width:100%; border-radius:18px; margin-top:10px; border:1px solid var(--line); }
    .task { display:grid; gap:8px; padding:12px; border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,.72); margin-top:10px; }
    .task-head { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
    .task-title { font-weight:950; }
    .pill { font-size:11px; padding:5px 9px; border-radius:999px; background:var(--soft); color:var(--primary-dark); white-space:nowrap; font-weight:900; }
    .task.done { opacity:.72; }
    .task.done .task-title { text-decoration:line-through; }
    .period-hero { text-align:center; padding:22px 14px; border-radius:28px; background:linear-gradient(135deg,#fff,#ffe2ec); border:1px solid var(--line); box-shadow:var(--shadow); }
    .period-num { font-size:52px; line-height:1; margin:8px 0; color:var(--primary-dark); font-weight:950; letter-spacing:-2px; }
    .stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
    .stat { background:white; border:1px solid var(--line); border-radius:20px; padding:10px; text-align:center; }
    .stat b { display:block; font-size:15px; margin-bottom:4px; }
    .stat span { font-size:11px; color:var(--muted); }
    .date-list { display:grid; gap:8px; }
    .date-item { display:flex; justify-content:space-between; align-items:center; padding:11px 12px; background:white; border:1px solid var(--line); border-radius:16px; }
    .bottom-nav { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); width:min(calc(100% - 24px),460px); display:grid; grid-template-columns:repeat(4,1fr); gap:6px; background:rgba(255,255,255,.86); border:1px solid var(--line); box-shadow:0 15px 50px rgba(0,0,0,.12); border-radius:26px; padding:7px; backdrop-filter:blur(16px); }
    .nav-btn { border:0; border-radius:20px; background:transparent; color:var(--muted); padding:8px 4px; font-size:11px; font-weight:900; cursor:pointer; }
    .nav-btn span { display:block; font-size:19px; margin-bottom:2px; }
    .nav-btn.active { background:var(--soft); color:var(--primary-dark); }
    .toast { position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(10px); background:rgba(51,37,43,.92); color:white; padding:10px 14px; border-radius:999px; opacity:0; pointer-events:none; transition:.2s; font-size:13px; z-index:20; max-width:min(420px,calc(100% - 32px)); text-align:center; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    .file-input { display:none; }
    .attachment-preview { display:none; margin-top:10px; padding:10px; border:1px dashed var(--line); border-radius:18px; background:rgba(255,255,255,.72); }
    .attachment-preview.show { display:block; }
    .attachment-list { display:grid; gap:8px; margin-top:8px; }
    .attachment-chip { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:15px; background:white; font-size:12px; color:var(--muted); }
    .attachment-chip b { color:var(--text); font-size:13px; }
    .attachment-thumb { max-width:150px; max-height:110px; object-fit:cover; border-radius:14px; border:1px solid var(--line); margin-top:8px; display:block; }
    .file-btn { display:inline-flex; align-items:center; justify-content:center; }
    .msg-attachments { display:grid; gap:8px; margin-top:8px; }
    .msg-file { border:1px solid rgba(255,255,255,.45); background:rgba(255,255,255,.18); border-radius:13px; padding:8px 9px; font-size:12px; }
    .bubble.assistant .msg-file, .bubble.ta .msg-file { border-color:var(--line); background:var(--soft); color:var(--text); }

    .duo-card { display:flex; flex-direction:column; min-height:calc(100vh - 260px); }
    .duo-card .chat-box { flex:1; height:52vh !important; min-height:330px !important; }
    .duo-composer-wrap { position:sticky; bottom:0; z-index:5; margin-top:10px; padding-top:8px; background:linear-gradient(180deg,rgba(255,255,255,0),var(--card) 24%); }
    .duo-composer { display:grid; grid-template-columns:46px 1fr auto; gap:8px; align-items:end; }
    .plus-btn { width:46px; min-width:46px; height:46px; padding:0; border-radius:50%; font-size:25px; line-height:1; }
    .duo-composer textarea { min-height:46px; max-height:120px; border-radius:22px; padding:12px 14px; }
    .duo-composer .btn { min-height:46px; border-radius:22px; padding:0 15px; }
    .plus-panel { display:none; margin:0 0 10px; padding:12px; border:1px solid var(--line); border-radius:20px; background:rgba(255,255,255,.88); box-shadow:0 10px 24px rgba(233,79,132,.10); }
    .plus-panel.show { display:block; animation:fade .2s ease; }
    .plus-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .plus-action { min-height:54px; padding:9px 6px; border-radius:18px; font-size:12px; font-weight:950; }
    .plus-task-form { display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
    .plus-task-form.show { display:block; }
    .duo-preview { display:none; margin:0 0 10px; padding:10px; border:1px dashed var(--line); border-radius:18px; background:rgba(255,255,255,.78); }
    .duo-preview.show { display:block; }
    .duo-preview img { max-width:140px; max-height:110px; object-fit:cover; border-radius:14px; border:1px solid var(--line); display:block; margin-top:8px; }
    .task-card { margin-top:14px; }
    @media (max-width:390px){ .app{padding-left:12px;padding-right:12px} .grid2{grid-template-columns:1fr} .brand h1{font-size:18px} .chip{display:none} .ai-upload-toolbar{grid-template-columns:1fr 1fr} .ai-upload-toolbar .ghost{grid-column:1/3} .plus-actions{grid-template-columns:repeat(3,1fr)} .duo-composer{grid-template-columns:42px 1fr auto} .plus-btn{width:42px;min-width:42px;height:42px} }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="avatar">💗</div>
        <div>
          <h1 id="appTitle">宝贝小窝</h1>
          <p id="appSubtitle">AI 对话 · 暗号互联 · 历史保存</p>
        </div>
      </div>
      <div class="chip" id="todayChip">今天</div>
    </header>

    <main>
      <section class="page active" id="page-ai">
        <div class="card">
          <h2>🤖 DeepSeek</h2>
        </div>
        <div class="card">
          <div class="chat-box" id="aiChatBox"></div>
          <div class="ai-upload-toolbar" aria-label="DeepSeek 附件上传">
            <label class="upload-card">🖼️ 上传图片
              <input class="file-input ai-file-input" id="aiImageFiles" type="file" multiple accept="image/*" onchange="handleAIFiles(event)" />
            </label>
            <label class="upload-card">📄 上传文件
              <input class="file-input ai-file-input" id="aiDocFiles" type="file" multiple accept=".txt,.md,.markdown,.json,.csv,.log,.html,.css,.js,.ts,.jsx,.tsx,.py,.java,.cpp,.c,.go,.rs,.xml,.yaml,.yml,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx" onchange="handleAIFiles(event)" />
            </label>
            <button class="btn ghost" type="button" onclick="clearAIAttachments()">移除附件</button>
          </div>
          <div class="composer ai-composer">
            <textarea id="aiInput" placeholder="想和 DeepSeek 说什么？" rows="1"></textarea>
            <label class="btn secondary attach-icon" title="选择图片或文件">📎
              <input class="file-input ai-file-input" id="aiFiles" type="file" multiple accept="image/*,.txt,.md,.markdown,.json,.csv,.log,.html,.css,.js,.ts,.jsx,.tsx,.py,.java,.cpp,.c,.go,.rs,.xml,.yaml,.yml,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx" onchange="handleAIFiles(event)" />
            </label>
            <button class="btn" id="aiSendBtn" onclick="sendAIMessage()">发送</button>
          </div>
          <div class="attachment-preview" id="aiAttachmentPreview"></div>
          <div class="btn-row">
            <button class="btn secondary" onclick="quickAI('帮我写一句温柔的晚安消息')">晚安文案</button>
            <button class="btn secondary" onclick="quickAI('今天有点累，哄哄我')">哄哄我</button>
            <button class="btn ghost" onclick="clearAIChat()">清空 AI 聊天</button>
          </div>
        </div>
      </section>

      <section class="page" id="page-us">
        <div class="card">
          <h2>💬 小聊天</h2>
          <div class="status">
            <div><span class="dot" id="syncDot"></span><b id="syncTitle">本地模式</b><div class="small" id="syncText">没有连接云同步时，只保存在当前浏览器。</div></div>
            <button class="btn ghost" onclick="copyRoomInfo()">复制房间</button>
          </div>
        </div>

        <div class="card duo-card">
          <h3>聊天记录</h3>
          <div class="chat-box" id="duoChatBox"></div>
          <div class="duo-composer-wrap">
            <div class="duo-preview" id="duoImagePreviewBox">
              <div class="small">已选择图片，点击发送会和文字一起提交。</div>
              <img id="duoPreview" alt="图片预览" />
            </div>
            <div class="plus-panel" id="duoPlusPanel">
              <div class="plus-actions">
                <label class="btn secondary plus-action">🖼️<br>提交图片
                  <input id="duoImage" class="file-input" type="file" accept="image/*" onchange="previewImage(event)" />
                </label>
                <button class="btn secondary plus-action" type="button" onclick="toggleTaskPanel()">✅<br>发布任务</button>
                <button class="btn ghost plus-action" type="button" onclick="clearDuoChat()">🧹<br>清空聊天</button>
              </div>
              <div class="plus-task-form" id="plusTaskForm">
                <label>任务标题</label>
                <input id="taskTitle" placeholder="例如：买红糖姜茶 / 拍照报备 / 晚上视频" />
                <label>任务说明</label>
                <textarea id="taskDesc" placeholder="写清楚怎么做、截止时间、要提交什么图片或文字～"></textarea>
                <label>截止日期</label>
                <input id="taskDue" type="date" />
                <div class="btn-row">
                  <button class="btn" onclick="addTask()">发布任务</button>
                  <button class="btn ghost" type="button" onclick="toggleTaskPanel(false)">收起</button>
                </div>
              </div>
            </div>
            <div class="duo-composer">
              <button class="btn secondary plus-btn" type="button" onclick="togglePlusPanel()">+</button>
              <textarea id="duoText" placeholder="写点想说的话～" rows="1"></textarea>
              <button class="btn" onclick="sendDuoMessage()">发送</button>
            </div>
          </div>
        </div>

        <div class="card task-card">
          <h3>任务列表</h3>
          <div class="btn-row" style="margin-top:0; margin-bottom:10px;">
            <button class="btn ghost" onclick="clearDoneTasks()">清理已完成</button>
          </div>
          <div id="taskList"></div>
        </div>
      </section>

      <section class="page" id="page-period">
        <div class="period-hero">
          <div class="small" id="periodPhase">预计提醒</div>
          <div class="period-num" id="periodDays">--</div>
          <div id="periodText">请先设置上次姨妈日期</div>
          <div class="stat-row">
            <div class="stat"><b id="nextDate">--</b><span>下次预计</span></div>
            <div class="stat"><b id="cycleLen">--</b><span>周期长度</span></div>
            <div class="stat"><b id="periodLen">--</b><span>持续天数</span></div>
          </div>
        </div>

        <div class="card" id="periodAlertCard" style="display:none; margin-top:14px;"><div class="danger" id="periodAlertText"></div></div>

        <div class="card">
          <h2>🩸 姨妈提醒日期</h2>
          <div class="grid2">
            <div><label>上次姨妈第一天</label><input id="periodLast" type="date" /></div>
            <div><label>平均周期</label><input id="periodCycle" type="number" min="15" max="60" /></div>
          </div>
          <div class="grid2">
            <div><label>持续天数</label><input id="periodDuration" type="number" min="1" max="12" /></div>
            <div><label>提前几天提醒</label><input id="periodBefore" type="number" min="0" max="14" /></div>
          </div>
          <div class="btn-row">
            <button class="btn" onclick="savePeriod()">保存姨妈提醒</button>
            <button class="btn secondary" onclick="requestNotify()">开启浏览器提醒</button>
          </div>
          <p class="hint">提醒会在打开页面时检查；浏览器通知需要授权。经期预测仅供生活提醒，不用于避孕或医疗判断。</p>
        </div>

        <div class="card">
          <h3>未来 6 次预计日期</h3>
          <div class="date-list" id="futureDates"></div>
        </div>
      </section>

      <section class="page" id="page-settings">
        <div class="card">
          <h2>⚙️ 设置</h2>
          <div class="grid2">
            <div><label>你的昵称</label><input id="setNickname" placeholder="宝贝" /></div>
            <div><label>对方昵称</label><input id="setPartner" placeholder="对方" /></div>
          </div>

          <div class="divider"></div>
          <h3>DeepSeek</h3>
          <label>模型</label>
          <select id="setModel">
            <option value="deepseek-v4-flash">deepseek-v4-flash</option>
            <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            <option value="deepseek-chat">deepseek-chat</option>
            <option value="deepseek-reasoner">deepseek-reasoner</option>
          </select>
          <label>AI 系统提示词</label>
          <textarea id="setPrompt" rows="4"></textarea>

          <div class="divider"></div>
          <h3>双人同步</h3>
          <label>聊天暗号</label>
          <input id="setPairCode" type="password" placeholder="两个人输入完全相同的暗号，例如：520love2026" />
          <details style="margin-top:12px;">
            <summary class="small" style="cursor:pointer; font-weight:900; color:var(--primary-dark);">高级：云同步配置</summary>
            <label>Firebase 配置 JSON</label>
            <textarea id="setFirebaseConfig" rows="6" placeholder='例如：{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'></textarea>
          </details>

          <div class="divider"></div>
          <label>主题颜色</label>
          <select id="setTheme">
            <option value="pink">蜜桃粉</option>
            <option value="purple">梦幻紫</option>
            <option value="blue">奶油蓝</option>
          </select>
          <div class="btn-row">
            <button class="btn" onclick="saveSettings()">保存并连接</button>
            <button class="btn secondary" onclick="connectRealtime(true)">重新连接</button>
            <button class="btn ghost" onclick="exportData()">导出数据</button>
            <button class="btn danger-btn" onclick="resetAll()">清空全部</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="ai" onclick="switchTab('ai')"><span>🤖</span>DeepSeek</button>
    <button class="nav-btn" data-tab="us" onclick="switchTab('us')"><span>💬</span>我们俩</button>
    <button class="nav-btn" data-tab="period" onclick="switchTab('period')"><span>🩸</span>姨妈</button>
    <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')"><span>⚙️</span>设置</button>
  </nav>
  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'my_girl_v10_state';

    const DEEPSEEK_API_KEY = 'sk-f1ce9072b5694a0b8b15b1124238ae41';
    const DEEPSEEK_API_URL = 'https://api.deepseek.com/chat/completions';

    const FIREBASE_VERSION = '10.12.5';
    const PEERJS_CDN = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    const BUILTIN_FIREBASE_CONFIG = null;
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const CLIENT_ID_KEY = 'my_girl_client_id';
    const clientId = localStorage.getItem(CLIENT_ID_KEY) || (() => { const id = crypto.randomUUID(); localStorage.setItem(CLIENT_ID_KEY, id); return id; })();

    const defaultState = {
      settings: {
        nickname: '宝贝',
        partnerName: '对方',
        deepseekModel: 'deepseek-v4-flash',
        apiProxyUrl: '',
        theme: 'pink',
        systemPrompt: '你是一个温柔、可爱、懂得照顾情绪的中文 AI 伴侣。回答要自然、有温度，必要时给出清晰可执行的建议。',
        firebaseConfigText: '',
        roomId: '',
        pairCode: '',
      },
      aiMessages: [
        { role: 'assistant', content: '嗨～我在这里。' }
      ],
      duoMessages: [],
      duoTasks: [],
      period: {
        lastDate: '2026-05-18',
        cycleLength: 28,
        duration: 5,
        remindBefore: 3,
        lastNotifyDate: ''
      }
    };

    let state = loadState();
    let pendingImageData = '';
    let pendingAIAttachments = [];
    let toastTimer = null;
    let firestoreReady = false;
    let firestoreConnecting = false;
    let firebaseApi = null;
    let activeDb = null;
    let activeUnsubs = [];
    let presenceTimer = null;
    let presenceRef = null;
    let memberCount = 0;
    let p2pPeer = null;
    let p2pHost = false;
    let p2pReady = false;
    let p2pConnecting = false;
    let p2pConnections = new Map();

    function loadState() {
      try {
        const legacy = JSON.parse(localStorage.getItem('my_girl_v2_state') || 'null');
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || JSON.parse(localStorage.getItem('my_girl_v6_state') || 'null') || JSON.parse(localStorage.getItem('my_girl_v5_state') || 'null') || JSON.parse(localStorage.getItem('my_girl_v4_state') || 'null') || JSON.parse(localStorage.getItem('my_girl_v3_state') || 'null') || legacy;
        const merged = saved ? deepMerge(structuredClone(defaultState), saved) : structuredClone(defaultState);
        delete merged.settings.deepseekApiKey;
        delete merged.settings.apiBaseUrl;
        return merged;
      } catch (_) {
        return structuredClone(defaultState);
      }
    }

    function deepMerge(target, source) {
      Object.keys(source || {}).forEach(key => {
        if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
          target[key] = deepMerge(target[key] || {}, source[key]);
        } else {
          target[key] = source[key];
        }
      });
      return target;
    }

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function showToast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function switchTab(tab) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + tab).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      if (tab === 'settings') fillSettingsForm();
      if (tab === 'period') fillPeriodForm();
      setTimeout(() => {
        const box = tab === 'ai' ? document.getElementById('aiChatBox') : document.getElementById('duoChatBox');
        if (box) box.scrollTop = box.scrollHeight;
      }, 60);
    }

    function applyTheme() {
      const themes = {
        pink: ['#fff6f8', '#ff6f9f', '#e94f84', '#ffe1eb'],
        purple: ['#fbf7ff', '#a277ff', '#7c52dd', '#eee4ff'],
        blue: ['#f5fbff', '#5aa9ff', '#2d7bd8', '#e1f0ff']
      };
      const [bg, primary, dark, soft] = themes[state.settings.theme || 'pink'] || themes.pink;
      document.documentElement.style.setProperty('--bg', bg);
      document.documentElement.style.setProperty('--primary', primary);
      document.documentElement.style.setProperty('--primary-dark', dark);
      document.documentElement.style.setProperty('--soft', soft);
    }

    function renderHeader() {
      document.getElementById('appTitle').textContent = `${state.settings.nickname || '宝贝'}小窝`;
      document.getElementById('appSubtitle').textContent = `${state.settings.partnerName || '对方'}陪你一起记录`;
      const now = new Date();
      document.getElementById('todayChip').textContent = `${now.getMonth() + 1}/${now.getDate()}`;
    }

    function roomLabel() {
      const id = state.settings.roomId || '';
      return id ? id.slice(-8).toUpperCase() : '未生成';
    }

    function hasCloudConfig() {
      return !!(BUILTIN_FIREBASE_CONFIG || String(state.settings.firebaseConfigText || '').trim());
    }


    function liveReady() {
      return firestoreReady || p2pReady;
    }

    function liveModeName() {
      if (firestoreReady) return '云同步';
      if (p2pReady) return '暗号直连';
      return '本地';
    }

    function p2pOnlineCount() {
      if (!p2pPeer) return 0;
      return Math.max(1, p2pConnections.size + 1);
    }

    function mergeById(existing, incoming, newestFirst = false) {
      const map = new Map((existing || []).filter(x => x && x.id).map(x => [x.id, x]));
      let changed = false;
      (incoming || []).forEach(item => {
        if (!item || !item.id) return;
        const old = map.get(item.id);
        if (!old || JSON.stringify(old) !== JSON.stringify(item)) {
          map.set(item.id, { ...(old || {}), ...item });
          changed = true;
        }
      });
      const arr = Array.from(map.values());
      arr.sort((a, b) => newestFirst
        ? new Date(b.createdAt || b.updatedAt || 0) - new Date(a.createdAt || a.updatedAt || 0)
        : new Date(a.createdAt || a.updatedAt || 0) - new Date(b.createdAt || b.updatedAt || 0));
      return { changed, arr };
    }

    function mergeDuoMessages(items, shouldRender = true) {
      const result = mergeById(state.duoMessages, Array.isArray(items) ? items : [items], false);
      if (result.changed) {
        state.duoMessages = result.arr;
        saveState();
        if (shouldRender) renderDuoChat();
      }
      return result.changed;
    }

    function mergeDuoTasks(items, shouldRender = true) {
      const result = mergeById(state.duoTasks, Array.isArray(items) ? items : [items], true);
      if (result.changed) {
        state.duoTasks = result.arr;
        saveState();
        if (shouldRender) renderTasks();
      }
      return result.changed;
    }

    function removeDuoTaskIds(ids, shouldRender = true) {
      const set = new Set(Array.isArray(ids) ? ids : [ids]);
      const before = state.duoTasks.length;
      state.duoTasks = state.duoTasks.filter(t => !set.has(t.id));
      const changed = before !== state.duoTasks.length;
      if (changed) {
        saveState();
        if (shouldRender) renderTasks();
      }
      return changed;
    }

    function applyRemotePeriod(period) {
      if (!period) return;
      state.period = { ...state.period, ...period };
      saveState();
      renderPeriod();
      fillPeriodForm();
      checkPeriodNotification();
    }

    function p2pBroadcast(payload, exceptPeerId = '') {
      if (!p2pPeer || !payload) return;
      const packet = { ...payload, fromClientId: clientId, sentAt: new Date().toISOString() };
      p2pConnections.forEach((conn, peerId) => {
        if (peerId === exceptPeerId) return;
        try { if (conn && conn.open) conn.send(packet); } catch (_) {}
      });
    }

    function p2pFullStatePayload() {
      return {
        type: 'sync',
        messages: state.duoMessages || [],
        tasks: state.duoTasks || [],
        period: state.period || {},
        settings: { nickname: state.settings.nickname, partnerName: state.settings.partnerName }
      };
    }

    function p2pSendFullState(conn) {
      try { if (conn && conn.open) conn.send({ ...p2pFullStatePayload(), fromClientId: clientId, sentAt: new Date().toISOString() }); } catch (_) {}
    }

    function handleP2PData(data, fromPeerId = '') {
      if (!data || data.fromClientId === clientId) return;
      let changed = false;
      if (data.type === 'message') {
        changed = mergeDuoMessages(data.message) || changed;
      } else if (data.type === 'sync') {
        changed = mergeDuoMessages(data.messages || []) || changed;
        changed = mergeDuoTasks(data.tasks || []) || changed;
        if (data.period) applyRemotePeriod(data.period);
        const conn = p2pConnections.get(fromPeerId);
        if (conn && conn.open) setTimeout(() => p2pSendFullState(conn), 250);
      } else if (data.type === 'task') {
        changed = mergeDuoTasks(data.task) || changed;
      } else if (data.type === 'taskDelete') {
        changed = removeDuoTaskIds(data.ids || data.id) || changed;
      } else if (data.type === 'clearMessages') {
        state.duoMessages = [];
        saveState(); renderDuoChat();
        changed = true;
      } else if (data.type === 'period') {
        applyRemotePeriod(data.period);
        changed = true;
      }
      if (p2pHost && changed) p2pBroadcast(data, fromPeerId);
    }

    function setupP2PConnection(conn) {
      if (!conn) return;
      p2pConnections.set(conn.peer, conn);
      conn.on('open', () => {
        p2pReady = true;
        p2pConnecting = false;
        firestoreConnecting = false;
        renderSyncStatus();
        p2pSendFullState(conn);
      });
      conn.on('data', data => handleP2PData(data, conn.peer));
      conn.on('close', () => {
        p2pConnections.delete(conn.peer);
        p2pReady = !!p2pHost || p2pConnections.size > 0;
        renderSyncStatus();
      });
      conn.on('error', () => {
        p2pConnections.delete(conn.peer);
        renderSyncStatus();
      });
    }

    function loadPeerJS() {
      return new Promise((resolve, reject) => {
        if (window.Peer) return resolve();
        const existing = document.querySelector('script[data-peerjs]');
        if (existing) {
          existing.addEventListener('load', resolve, { once: true });
          existing.addEventListener('error', () => reject(new Error('PeerJS 加载失败')), { once: true });
          return;
        }
        const script = document.createElement('script');
        script.src = PEERJS_CDN;
        script.async = true;
        script.dataset.peerjs = '1';
        script.onload = resolve;
        script.onerror = () => reject(new Error('PeerJS 加载失败'));
        document.head.appendChild(script);
      });
    }

    function roomPeerId(roomId) {
      return ('mygirl-' + String(roomId || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40)).toLowerCase();
    }

    async function connectP2P(roomId, showResult = false) {
      await loadPeerJS();
      p2pConnecting = true;
      firestoreConnecting = true;
      renderSyncStatus();
      const targetPeerId = roomPeerId(roomId);
      await new Promise((resolve) => {
        let resolved = false;
        const finish = () => { if (!resolved) { resolved = true; resolve(); } };
        const becomeClient = () => {
          p2pHost = false;
          p2pPeer = new Peer(undefined, { debug: 0 });
          p2pPeer.on('open', () => {
            const conn = p2pPeer.connect(targetPeerId, { reliable: true, metadata: { clientId, name: state.settings.nickname } });
            setupP2PConnection(conn);
            setTimeout(finish, 600);
          });
          p2pPeer.on('connection', setupP2PConnection);
          p2pPeer.on('error', err => {
            p2pReady = false;
            p2pConnecting = false;
            firestoreConnecting = false;
            renderSyncStatus();
            if (showResult) showToast('暗号直连失败：' + (err?.message || err));
            finish();
          });
        };
        p2pPeer = new Peer(targetPeerId, { debug: 0 });
        p2pPeer.on('open', () => {
          p2pHost = true;
          p2pReady = true;
          p2pConnecting = false;
          firestoreConnecting = false;
          renderSyncStatus();
          if (showResult) showToast('已进入暗号房间，等待对方打开同一暗号');
          finish();
        });
        p2pPeer.on('connection', setupP2PConnection);
        p2pPeer.on('error', err => {
          const msg = String(err?.type || err?.message || err);
          try { if (p2pPeer) p2pPeer.destroy(); } catch (_) {}
          if (msg.includes('unavailable-id') || msg.includes('taken') || msg.includes('ID')) {
            becomeClient();
          } else {
            p2pReady = false;
            p2pConnecting = false;
            firestoreConnecting = false;
            renderSyncStatus();
            if (showResult) showToast('暗号直连失败：' + (err?.message || err));
            finish();
          }
        });
      });
      p2pConnecting = false;
      firestoreConnecting = false;
      renderSyncStatus();
      if (showResult && p2pReady && p2pConnections.size > 0) showToast('暗号直连成功');
    }

    function renderSyncStatus() {
      const dot = document.getElementById('syncDot');
      const title = document.getElementById('syncTitle');
      const text = document.getElementById('syncText');
      dot.className = 'dot';
      if (firestoreReady) {
        dot.classList.add('on');
        title.textContent = '暗号房间已连接';
        text.textContent = `云同步 · 房间尾号 ${roomLabel()} · 在线 ${Math.max(memberCount, 1)}`;
      } else if (p2pReady) {
        dot.classList.add('on');
        title.textContent = '暗号房间已在线';
        text.textContent = `直连 · 房间尾号 ${roomLabel()} · 在线 ${p2pOnlineCount()}`;
      } else if (firestoreConnecting || p2pConnecting) {
        dot.classList.add('warn-dot');
        title.textContent = '正在进入暗号房间';
        text.textContent = '请保持两边页面都打开。';
      } else if (state.settings.pairCode) {
        dot.classList.add('warn-dot');
        title.textContent = '暗号房间未连接';
        text.textContent = '点“保存并连接”或“重新连接”。';
      } else {
        title.textContent = '未进入房间';
        text.textContent = '先到设置输入同一个聊天暗号。';
      }
    }

    function clearAIChat() {
      if (!confirm('确定清空 AI 聊天记录吗？')) return;
      state.aiMessages = structuredClone(defaultState.aiMessages);
      saveState(); renderAIChat();
    }

    function renderDuoChat() {
      const box = document.getElementById('duoChatBox');
      if (!state.duoMessages.length) {
        box.innerHTML = '<div class="empty">还没有聊天记录，发第一条吧～</div>';
        return;
      }
      const messages = [...state.duoMessages].sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
      box.innerHTML = messages.map(msg => {
        const isMine = msg.senderId ? msg.senderId === clientId : false;
        const side = isMine ? 'me' : 'ta';
        const name = msg.senderName || (isMine ? state.settings.nickname : state.settings.partnerName) || '对方';
        return `
        <div class="bubble-row ${side}">
          <div>
            <div class="bubble ${side}">
              ${msg.text ? escapeHtml(msg.text) : ''}
              ${msg.image ? `<img class="msg-img" src="${msg.image}" alt="提交图片" />` : ''}
            </div>
            <div class="meta">${escapeHtml(name)} · ${formatDateTime(msg.createdAt)}</div>
          </div>
        </div>`;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    function togglePlusPanel(force) {
      const panel = document.getElementById('duoPlusPanel');
      if (!panel) return;
      const show = typeof force === 'boolean' ? force : !panel.classList.contains('show');
      panel.classList.toggle('show', show);
      if (!show) toggleTaskPanel(false);
    }

    function toggleTaskPanel(force) {
      const form = document.getElementById('plusTaskForm');
      if (!form) return;
      const show = typeof force === 'boolean' ? force : !form.classList.contains('show');
      form.classList.toggle('show', show);
      if (show) togglePlusPanel(true);
    }

    async function previewImage(event) {
      const file = event.target.files?.[0];
      const preview = document.getElementById('duoPreview');
      const box = document.getElementById('duoImagePreviewBox');
      pendingImageData = '';
      if (preview) preview.removeAttribute('src');
      if (box) box.classList.remove('show');
      if (!file) return;
      if (!file.type.startsWith('image/')) return showToast('请选择图片文件');
      try {
        pendingImageData = await compressImage(file, 820, 0.68);
        if (pendingImageData.length > 650000) {
          pendingImageData = '';
          event.target.value = '';
          return showToast('图片还是太大，换一张小一点的图，避免云端保存失败');
        }
        preview.src = pendingImageData;
        if (box) box.classList.add('show');
        togglePlusPanel(false);
      } catch (err) {
        showToast('图片读取失败：' + err.message);
      }
    }

    function compressImage(file, maxSide, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('无法读取图片'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('无法加载图片'));
          img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function sendDuoMessage() {
      const textEl = document.getElementById('duoText');
      const text = textEl.value.trim();
      if (!text && !pendingImageData) return showToast('写点文字或选择一张图片再提交～');
      const message = {
        id: crypto.randomUUID(),
        who: 'member',
        senderId: clientId,
        senderName: state.settings.nickname || '我',
        text,
        image: pendingImageData,
        createdAt: new Date().toISOString()
      };
      try {
        if (firestoreReady) await addRemoteMessage(message);
        else {
          mergeDuoMessages(message);
          if (p2pReady) p2pBroadcast({ type: 'message', message });
          else if (state.settings.pairCode) connectRealtime(false);
        }
        textEl.value = '';
        autoSizeTextarea(textEl);
        document.getElementById('duoImage').value = '';
        document.getElementById('duoPreview').removeAttribute('src');
        const previewBox = document.getElementById('duoImagePreviewBox');
        if (previewBox) previewBox.classList.remove('show');
        pendingImageData = '';
        showToast(liveReady() ? '已发送' : '已保存，正在尝试进入暗号房间');
      } catch (err) {
        showToast('发送失败：' + err.message);
      }
    }

    async function clearDuoChat() {
      if (!confirm('确定清空聊天记录吗？')) return;
      if (firestoreReady) {
        const ok = confirm('当前是实时同步模式，会删除云端房间里的聊天记录，确定吗？');
        if (!ok) return;
        await deleteAllRemoteMessages();
      } else {
        state.duoMessages = [];
        saveState(); renderDuoChat();
        if (p2pReady) p2pBroadcast({ type: 'clearMessages' });
      }
    }

    async function addTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const desc = document.getElementById('taskDesc').value.trim();
      const due = document.getElementById('taskDue').value;
      if (!title) return showToast('任务标题不能为空');
      const task = { id: crypto.randomUUID(), title, desc, due, done: false, createdAt: new Date().toISOString(), doneAt: '' };
      try {
        if (firestoreReady) await addRemoteTask(task);
        else {
          mergeDuoTasks(task);
          if (p2pReady) p2pBroadcast({ type: 'task', task });
          else if (state.settings.pairCode) connectRealtime(false);
        }
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
        document.getElementById('taskDue').value = '';
        toggleTaskPanel(false);
        togglePlusPanel(false);
        showToast(liveReady() ? '任务已发布' : '任务已保存，正在尝试进入暗号房间');
      } catch (err) {
        showToast('发布失败：' + err.message);
      }
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      if (!state.duoTasks.length) {
        list.innerHTML = '<div class="empty">还没有任务，发布一个小任务吧～</div>';
        return;
      }
      const tasks = [...state.duoTasks].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      list.innerHTML = tasks.map(task => `
        <div class="task ${task.done ? 'done' : ''}">
          <div class="task-head">
            <div>
              <div class="task-title">${escapeHtml(task.title)}</div>
              <div class="small">${task.due ? `截止：${escapeHtml(task.due)}` : '未设置截止日期'}</div>
            </div>
            <span class="pill">${task.done ? '已完成' : '进行中'}</span>
          </div>
          ${task.desc ? `<div class="hint">${escapeHtml(task.desc)}</div>` : ''}
          <div class="btn-row">
            <button class="btn secondary" onclick="toggleTaskDone('${task.id}')">${task.done ? '标记未完成' : '打卡完成'}</button>
            <button class="btn ghost" onclick="taskToChat('${task.id}')">提交到聊天</button>
            <button class="btn ghost" onclick="deleteTask('${task.id}')">删除</button>
          </div>
        </div>`).join('');
    }

    async function toggleTaskDone(id) {
      const task = state.duoTasks.find(t => t.id === id);
      if (!task) return;
      const patch = { done: !task.done, doneAt: !task.done ? new Date().toISOString() : '' };
      try {
        if (firestoreReady) await updateRemoteTask(id, patch);
        else {
          Object.assign(task, patch);
          saveState(); renderTasks();
          if (p2pReady) p2pBroadcast({ type: 'task', task });
        }
        showToast(patch.done ? '任务完成啦，表现不错！' : '已改回进行中');
      } catch (err) {
        showToast('更新失败：' + err.message);
      }
    }

    async function taskToChat(id) {
      const task = state.duoTasks.find(t => t.id === id);
      if (!task) return;
      const message = {
        id: crypto.randomUUID(),
        who: 'member',
        senderId: clientId,
        senderName: state.settings.nickname || '我',
        text: `任务反馈：${task.title}\n状态：${task.done ? '已完成' : '进行中'}${task.desc ? `\n说明：${task.desc}` : ''}`,
        image: '',
        createdAt: new Date().toISOString()
      };
      try {
        if (firestoreReady) await addRemoteMessage(message);
        else {
          mergeDuoMessages(message);
          if (p2pReady) p2pBroadcast({ type: 'message', message });
        }
        switchTab('us');
        showToast('已提交到聊天记录');
      } catch (err) {
        showToast('提交失败：' + err.message);
      }
    }

    async function deleteTask(id) {
      try {
        if (firestoreReady) await deleteRemoteTask(id);
        else {
          removeDuoTaskIds(id);
          if (p2pReady) p2pBroadcast({ type: 'taskDelete', id, ids: [id] });
        }
      } catch (err) {
        showToast('删除失败：' + err.message);
      }
    }

    async function clearDoneTasks() {
      const doneTasks = state.duoTasks.filter(t => t.done);
      try {
        if (firestoreReady) {
          for (const task of doneTasks) await deleteRemoteTask(task.id);
        } else {
          const ids = doneTasks.map(t => t.id);
          state.duoTasks = state.duoTasks.filter(t => !t.done);
          saveState(); renderTasks();
          if (p2pReady && ids.length) p2pBroadcast({ type: 'taskDelete', ids });
        }
        showToast('已清理完成任务');
      } catch (err) {
        showToast('清理失败：' + err.message);
      }
    }

    function parseFirebaseConfig() {
      const config = BUILTIN_FIREBASE_CONFIG || (() => {
        const text = (state.settings.firebaseConfigText || '').trim();
        return text ? JSON.parse(text) : null;
      })();
      if (!config) return null;
      if (!config.apiKey || !config.projectId || !config.appId) throw new Error('云同步配置缺少 apiKey/projectId/appId');
      return config;
    }

    async function deriveRoomIdFromPassphrase(passphrase) {
      const raw = String(passphrase || '').trim();
      if (!raw) return '';
      const normalized = raw.normalize('NFKC').replace(/\s+/g, ' ');
      if (window.crypto?.subtle) {
        const bytes = new TextEncoder().encode('my-girl-room-v1:' + normalized);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        const hex = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
        return cleanRoomId('love-' + hex.slice(0, 32));
      }
      let h = 2166136261;
      for (const ch of normalized) {
        h ^= ch.charCodeAt(0);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return cleanRoomId('love-' + Math.abs(h >>> 0).toString(16));
    }

    async function ensureRoomFromPassphrase() {
      const code = String(state.settings.pairCode || '').trim();
      if (!code) return '';
      const roomId = await deriveRoomIdFromPassphrase(code);
      state.settings.roomId = roomId;
      saveState();
      return roomId;
    }

    function onlineMembersFromSnap(snap) {
      const now = Date.now();
      return snap.docs.map(d => normalizeDoc(d.data())).filter(item => {
        const t = item.lastSeen ? new Date(item.lastSeen).getTime() : 0;
        return t && now - t < 2 * 60 * 1000;
      });
    }

    async function updatePresence(db, roomId) {
      if (!firebaseApi) return;
      const { doc, setDoc, serverTimestamp } = firebaseApi;
      presenceRef = doc(db, 'rooms', roomId, 'members', clientId);
      await setDoc(presenceRef, {
        id: clientId,
        name: state.settings.nickname,
        lastSeen: serverTimestamp()
      }, { merge: true });
    }

    async function connectRealtime(showResult = false) {
      closeRealtime();
      firestoreReady = false;
      firestoreConnecting = true;
      renderSyncStatus();
      try {
        const roomId = await ensureRoomFromPassphrase();
        if (!roomId) throw new Error('请先填写聊天暗号。两个人输入完全相同的暗号才能进入同一房间');
        const config = parseFirebaseConfig();
        if (!config) {
          await connectP2P(roomId, showResult);
          return;
        }
        if (!firebaseApi) {
          const appMod = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`);
          const fsMod = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`);
          firebaseApi = { ...appMod, ...fsMod };
        }
        const appName = 'my-girl-' + config.projectId;
        const app = firebaseApi.getApps().find(a => a.name === appName) || firebaseApi.initializeApp(config, appName);
        const db = firebaseApi.getFirestore(app);
        activeDb = db;
        const roomRef = firebaseApi.doc(db, 'rooms', roomId);
        const periodRef = firebaseApi.doc(db, 'rooms', roomId, 'period', 'current');
        await firebaseApi.setDoc(roomRef, {
          updatedAt: firebaseApi.serverTimestamp(),
          roomLabel: roomLabel(),
          version: 'v10-passphrase-p2p-history'
        }, { merge: true });

        const periodSnap = await firebaseApi.getDoc(periodRef);
        if (!periodSnap.exists()) {
          await firebaseApi.setDoc(periodRef, { ...state.period, updatedAt: firebaseApi.serverTimestamp() }, { merge: true });
        }

        const messagesQuery = firebaseApi.query(firebaseApi.collection(db, 'rooms', roomId, 'messages'), firebaseApi.orderBy('createdAt', 'asc'));
        const tasksQuery = firebaseApi.query(firebaseApi.collection(db, 'rooms', roomId, 'tasks'), firebaseApi.orderBy('createdAt', 'desc'));

        activeUnsubs.push(firebaseApi.onSnapshot(messagesQuery, snap => {
          state.duoMessages = snap.docs.map(d => ({ id: d.id, ...normalizeDoc(d.data()) }));
          saveState(); renderDuoChat();
        }));
        activeUnsubs.push(firebaseApi.onSnapshot(tasksQuery, snap => {
          state.duoTasks = snap.docs.map(d => ({ id: d.id, ...normalizeDoc(d.data()) }));
          saveState(); renderTasks();
        }));
        activeUnsubs.push(firebaseApi.onSnapshot(periodRef, snap => {
          if (snap.exists()) {
            state.period = { ...state.period, ...normalizeDoc(snap.data()) };
            saveState(); renderPeriod(); fillPeriodForm(); checkPeriodNotification();
          }
        }));
        await updatePresence(db, roomId);
        presenceTimer = setInterval(() => updatePresence(db, roomId).catch(() => {}), 30000);
        activeUnsubs.push(firebaseApi.onSnapshot(firebaseApi.collection(db, 'rooms', roomId, 'members'), snap => {
          memberCount = onlineMembersFromSnap(snap).length || 1;
          renderSyncStatus();
        }));

        firestoreReady = true;
        firestoreConnecting = false;
        renderSyncStatus();
        if (showResult) showToast('暗号房间连接成功，历史数据会自动同步保存');
      } catch (err) {
        firestoreReady = false;
        firestoreConnecting = false;
        renderSyncStatus();
        if (showResult) showToast('暗号房间连接失败：' + err.message);
      }
    }

    function closeRealtime() {
      activeUnsubs.forEach(fn => { try { fn(); } catch (_) {} });
      activeUnsubs = [];
      if (presenceTimer) clearInterval(presenceTimer);
      presenceTimer = null;
      presenceRef = null;
      memberCount = 0;
      activeDb = null;
      firestoreReady = false;
      firestoreConnecting = false;
      p2pConnections.forEach(conn => { try { conn.close(); } catch (_) {} });
      p2pConnections = new Map();
      if (p2pPeer) { try { p2pPeer.destroy(); } catch (_) {} }
      p2pPeer = null;
      p2pHost = false;
      p2pReady = false;
      p2pConnecting = false;
    }

    function cleanRoomId(roomId) { return String(roomId || '').trim().replace(/[\/#?%]/g, '-').slice(0, 80); }

    function normalizeDoc(data) {
      const copy = { ...data };
      ['createdAt', 'doneAt', 'updatedAt', 'lastSeen'].forEach(k => {
        if (copy[k] && typeof copy[k].toDate === 'function') copy[k] = copy[k].toDate().toISOString();
      });
      return copy;
    }

    function currentRoomId() {
      return cleanRoomId(state.settings.roomId);
    }

    async function addRemoteMessage(message) {
      const { doc, setDoc, collection, getFirestore, serverTimestamp } = firebaseApi;
      const db = activeDb || getFirestore();
      const id = message.id || crypto.randomUUID();
      await setDoc(doc(collection(db, 'rooms', currentRoomId(), 'messages'), id), { ...message, id, createdAt: message.createdAt || new Date().toISOString(), serverAt: serverTimestamp() });
    }

    async function deleteAllRemoteMessages() {
      const { getFirestore, collection, getDocs, deleteDoc, doc } = firebaseApi;
      const db = activeDb || getFirestore();
      const snap = await getDocs(collection(db, 'rooms', currentRoomId(), 'messages'));
      for (const item of snap.docs) await deleteDoc(doc(db, 'rooms', currentRoomId(), 'messages', item.id));
    }

    async function addRemoteTask(task) {
      const { getFirestore, doc, setDoc, collection, serverTimestamp } = firebaseApi;
      const db = activeDb || getFirestore();
      const id = task.id || crypto.randomUUID();
      await setDoc(doc(collection(db, 'rooms', currentRoomId(), 'tasks'), id), { ...task, id, createdAt: task.createdAt || new Date().toISOString(), serverAt: serverTimestamp() });
    }

    async function updateRemoteTask(id, patch) {
      const { getFirestore, doc, updateDoc, serverTimestamp } = firebaseApi;
      const db = activeDb || getFirestore();
      await updateDoc(doc(db, 'rooms', currentRoomId(), 'tasks', id), { ...patch, serverAt: serverTimestamp() });
    }

    async function deleteRemoteTask(id) {
      const { getFirestore, doc, deleteDoc } = firebaseApi;
      const db = activeDb || getFirestore();
      await deleteDoc(doc(db, 'rooms', currentRoomId(), 'tasks', id));
    }

    async function syncPeriodToRemote() {
      if (!firestoreReady || !firebaseApi) return;
      const { getFirestore, doc, setDoc, serverTimestamp } = firebaseApi;
      const db = activeDb || getFirestore();
      await setDoc(doc(db, 'rooms', currentRoomId(), 'period', 'current'), { ...state.period, updatedAt: serverTimestamp() }, { merge: true });
    }

    async function copyRoomInfo() {
      const text = `My Girl 聊天暗号：请填写你们约定的同一个暗号
房间尾号：${roomLabel()}
提示：暗号完全一致才会进入同一房间。`;
      try {
        await navigator.clipboard.writeText(text);
        showToast('暗号房间信息已复制');
      } catch (_) {
        prompt('复制暗号房间信息', text);
      }
    }

    function parseLocalDate(iso) { if (!iso) return null; const [y,m,d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
    function startOfDay(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
    function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
    function daysBetween(a,b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }
    function formatISO(date) { const y = date.getFullYear(); const m = String(date.getMonth()+1).padStart(2,'0'); const d = String(date.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
    function formatCN(date) { return `${date.getMonth()+1}月${date.getDate()}日`; }
    function formatDateTime(iso) { if (!iso) return ''; const d = new Date(iso); if (Number.isNaN(d.getTime())) return ''; return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

    function getPeriodInfo() {
      const p = state.period;
      const last = parseLocalDate(p.lastDate);
      if (!last) return null;
      const today = startOfDay(new Date());
      let next = new Date(last);
      while (next < today) next = addDays(next, Number(p.cycleLength) || 28);
      const prev = addDays(next, -(Number(p.cycleLength) || 28));
      const dayInCycle = daysBetween(prev, today) + 1;
      const daysToNext = daysBetween(today, next);
      const isPeriod = dayInCycle >= 1 && dayInCycle <= (Number(p.duration) || 5);
      const fertileStart = addDays(prev, (Number(p.cycleLength) || 28) - 19);
      const fertileEnd = addDays(prev, (Number(p.cycleLength) || 28) - 12);
      return { last, today, next, prev, dayInCycle, daysToNext, isPeriod, fertileStart, fertileEnd };
    }

    function renderPeriod() {
      const info = getPeriodInfo();
      const p = state.period;
      if (!info) return;
      document.getElementById('periodDays').textContent = info.isPeriod ? `第${info.dayInCycle}天` : info.daysToNext;
      document.getElementById('periodText').textContent = info.isPeriod ? '当前预计处在姨妈期，好好休息' : '天后预计来姨妈';
      document.getElementById('nextDate').textContent = formatCN(info.next);
      document.getElementById('cycleLen').textContent = `${p.cycleLength}天`;
      document.getElementById('periodLen').textContent = `${p.duration}天`;
      let phase = '周期记录';
      if (info.isPeriod) phase = '姨妈期中';
      else if (info.daysToNext <= Number(p.remindBefore || 3)) phase = '临近提醒';
      else if (info.today >= info.fertileStart && info.today <= info.fertileEnd) phase = '排卵窗口估算';
      document.getElementById('periodPhase').textContent = phase;
      const alertCard = document.getElementById('periodAlertCard');
      const alertText = document.getElementById('periodAlertText');
      if (info.isPeriod) {
        alertCard.style.display = 'block';
        alertText.textContent = '姨妈期预计进行中：注意保暖、早点睡、把卫生巾和止痛/热敷用品放在顺手的位置。身体异常疼痛或周期长期紊乱时，建议咨询医生。';
      } else if (info.daysToNext <= Number(p.remindBefore || 3)) {
        alertCard.style.display = 'block';
        alertText.textContent = `还有 ${info.daysToNext} 天预计来姨妈：可以提前准备卫生巾、热敷贴、温水杯，也提醒 TA 多照顾你一点。`;
      } else alertCard.style.display = 'none';
      const dates = [];
      let d = new Date(info.next);
      for (let i = 0; i < 6; i++) { dates.push({ start:new Date(d), end:addDays(d, Number(p.duration || 5) - 1) }); d = addDays(d, Number(p.cycleLength || 28)); }
      document.getElementById('futureDates').innerHTML = dates.map((item, index) => `
        <div class="date-item"><div><b>第 ${index + 1} 次</b><div class="small">预计 ${formatCN(item.start)} - ${formatCN(item.end)}</div></div><span class="pill">${formatISO(item.start)}</span></div>`).join('');
    }

    function fillPeriodForm() {
      document.getElementById('periodLast').value = state.period.lastDate || '';
      document.getElementById('periodCycle').value = state.period.cycleLength || 28;
      document.getElementById('periodDuration').value = state.period.duration || 5;
      document.getElementById('periodBefore').value = state.period.remindBefore ?? 3;
    }

    async function savePeriod() {
      const lastDate = document.getElementById('periodLast').value;
      if (!lastDate) return showToast('请填写上次姨妈第一天');
      state.period.lastDate = lastDate;
      state.period.cycleLength = Number(document.getElementById('periodCycle').value) || 28;
      state.period.duration = Number(document.getElementById('periodDuration').value) || 5;
      state.period.remindBefore = Number(document.getElementById('periodBefore').value) || 0;
      saveState(); renderPeriod();
      try {
        await syncPeriodToRemote();
        if (!firestoreReady && p2pReady) p2pBroadcast({ type: 'period', period: state.period });
        showToast(liveReady() ? '姨妈提醒已保存' : '姨妈提醒已保存到本地');
      } catch (err) {
        showToast('姨妈提醒本地已保存，但同步失败：' + err.message);
      }
    }

    function requestNotify() {
      if (!('Notification' in window)) return showToast('当前浏览器不支持通知');
      Notification.requestPermission().then(permission => showToast(permission === 'granted' ? '浏览器提醒已开启' : '你没有授权浏览器提醒'));
    }

    function checkPeriodNotification() {
      const info = getPeriodInfo();
      if (!info || !('Notification' in window) || Notification.permission !== 'granted') return;
      const today = todayISO();
      const shouldNotify = info.isPeriod || info.daysToNext <= Number(state.period.remindBefore || 3);
      if (shouldNotify && state.period.lastNotifyDate !== today) {
        new Notification('姨妈提醒', { body: info.isPeriod ? '预计姨妈期中，今天也要好好照顾自己。' : `还有 ${info.daysToNext} 天预计来姨妈，记得提前准备。` });
        state.period.lastNotifyDate = today; saveState(); syncPeriodToRemote().catch(() => {}); if (p2pReady) p2pBroadcast({ type: 'period', period: state.period });
      }
    }

    function fillSettingsForm() {
      const s = state.settings;
      document.getElementById('setNickname').value = s.nickname || '';
      document.getElementById('setPartner').value = s.partnerName || '';
      const proxyInput = document.getElementById('setProxyUrl');
      if (proxyInput) proxyInput.value = s.apiProxyUrl || '';
      document.getElementById('setModel').value = s.deepseekModel || 'deepseek-v4-flash';
      document.getElementById('setPrompt').value = s.systemPrompt || defaultState.settings.systemPrompt;
      const pairInput = document.getElementById('setPairCode');
      if (pairInput) pairInput.value = s.pairCode || '';
      document.getElementById('setFirebaseConfig').value = s.firebaseConfigText || '';
      document.getElementById('setTheme').value = s.theme || 'pink';
    }

    async function saveSettings() {
      const oldRoom = state.settings.roomId;
      const oldFirebase = state.settings.firebaseConfigText;
      const oldPair = state.settings.pairCode;
      state.settings.nickname = document.getElementById('setNickname').value.trim() || '宝贝';
      state.settings.partnerName = document.getElementById('setPartner').value.trim() || '对方';
      const proxyInput = document.getElementById('setProxyUrl');
      state.settings.apiProxyUrl = proxyInput ? proxyInput.value.trim() : '';
      state.settings.deepseekModel = document.getElementById('setModel').value;
      state.settings.systemPrompt = document.getElementById('setPrompt').value.trim() || defaultState.settings.systemPrompt;
      const pairInput = document.getElementById('setPairCode');
      state.settings.pairCode = pairInput ? pairInput.value.trim() : '';
      state.settings.firebaseConfigText = document.getElementById('setFirebaseConfig').value.trim();
      if (state.settings.pairCode) await ensureRoomFromPassphrase();
      else state.settings.roomId = '';
      state.settings.theme = document.getElementById('setTheme').value;
      saveState(); applyTheme(); renderHeader(); renderAIChat(); renderDuoChat(); renderTasks(); renderPeriod(); renderSyncStatus();
      showToast('设置已保存');
      if ((oldRoom !== state.settings.roomId || oldFirebase !== state.settings.firebaseConfigText || oldPair !== state.settings.pairCode) && state.settings.pairCode) connectRealtime(false);
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `my-girl-backup-${todayISO()}.json`; a.click();
      URL.revokeObjectURL(url);
    }

    function resetAll() {
      if (!confirm('确定清空全部本地数据吗？这个操作不能恢复。')) return;
      closeRealtime();
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem('my_girl_v9_state');
      localStorage.removeItem('my_girl_v8_state');
      localStorage.removeItem('my_girl_v6_state');
      localStorage.removeItem('my_girl_v5_state');
      localStorage.removeItem('my_girl_v4_state');
      localStorage.removeItem('my_girl_v3_state');
      localStorage.removeItem('my_girl_v2_state');
      state = structuredClone(defaultState);
      pendingImageData = '';
      pendingAIAttachments = [];
      init(); showToast('已恢复默认数据');
    }

    function escapeHtml(text) {
      return String(text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function autoSizeTextarea(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    function bindAutoSizeTextareas() {
      document.querySelectorAll('textarea').forEach(el => {
        autoSizeTextarea(el);
        el.addEventListener('input', () => autoSizeTextarea(el));
      });
    }

    function init() {
      applyTheme(); renderHeader(); renderAIChat(); renderDuoChat(); renderTasks(); renderPeriod(); fillSettingsForm(); fillPeriodForm(); renderSyncStatus(); bindAutoSizeTextareas(); checkPeriodNotification();
      renderAIAttachmentPreview();
      if (state.settings.pairCode) connectRealtime(false);
    }

    init();
  </script>
</body>
